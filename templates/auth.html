{% extends 'base.html' %}
{% block title %}Вход · Генератор кода{% endblock %}
{% block content %}
<span class="label">Сервис 02 · Вход по паролю</span>
<section id="login-section">
  <h1>Сначала войди</h1>
  <p>Код появится после входа. Обновление страницы завершит сеанс.</p>
  <form id="login-form">
    <label for="username">Логин</label>
    <input id="username" name="username" autocomplete="username" required maxlength="128">
    <label for="password">Пароль</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="1024">
    <p id="error" role="alert"></p>
    <button type="submit">Войти и получить код</button>
  </form>
</section>
<section id="result" hidden>
  <h1>Твой случайный код</h1>
  <output id="code" class="code" aria-live="polite"></output>
  <p>После обновления страницы потребуется войти снова.</p>
  <a class="button" href="/">Выйти</a>
</section>
<script src="{{ url_for('static', filename='auth.js') }}" defer></script>
{% endblock %}
